volumes:
  pg_data:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    ports:
      - 127.0.0.1:5432:5432

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    depends_on:
      - db
    env_file: .env
    restart: on-failure

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    depends_on:
      - db
    restart: on-failure
